<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Agent 公开课清单</title>
  <style>
    :root {
      --bg-canvas: #F6F7F9;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F9FAFB;
      --bg-accent-soft: #EFF6FF;
      --text-primary: #111827;
      --text-body: #1F2937;
      --text-secondary: #4B5563;
      --text-muted: #6B7280;
      --border-light: #E5E7EB;
      --border-strong: #D1D5DB;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-ring: rgba(37, 99, 235, 0.22);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --max-width: 1180px;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: clip;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute;
      left: 16px;
      top: -100px;
      z-index: 100;
      padding: 8px 14px;
      background: var(--text-primary);
      color: #FFFFFF;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
    }

    .skip-link:focus {
      top: 12px;
      color: #FFFFFF;
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    /* Editorial Masthead */
    .masthead {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      padding: 28px 0 24px;
    }

    .masthead-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .masthead-meta .sep {
      color: var(--border-strong);
      user-select: none;
    }

    .masthead-title {
      margin: 0;
      font-size: clamp(26px, 3.2vw, 34px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .masthead-desc {
      margin: 10px 0 0;
      color: var(--text-secondary);
      font-size: 15px;
      max-width: 72ch;
    }

    .masthead-stats {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      font-size: 13px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Sticky Selection Bar */
    .toolbar-wrap {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-light);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
      padding-top: 12px;
      padding-bottom: 12px;
    }

    .toolbar-status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      min-width: 0;
    }

    .selection-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .selection-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .selection-count[data-active="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .feedback-text {
      font-size: 13px;
      color: var(--text-secondary);
      min-height: 1.4em;
    }

    .feedback-text[data-tone="accent"] {
      color: var(--accent);
      font-weight: 500;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-subtle);
      border-color: #9CA3AF;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #FFFFFF;
    }

    .btn-ghost {
      border-color: transparent;
      background: transparent;
      color: var(--text-secondary);
      padding: 0 10px;
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-canvas);
      border-color: transparent;
      color: var(--text-primary);
    }

    /* Manual Copy Fallback Drawer */
    .fallback-panel {
      border-top: 1px solid var(--border-light);
      background: var(--bg-subtle);
      padding: 14px 0 16px;
    }

    .fallback-panel[hidden] {
      display: none;
    }

    .fallback-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      margin-bottom: 10px;
    }

    .fallback-title {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .fallback-hint {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .fallback-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .fallback-textarea {
      width: 100%;
      min-height: 150px;
      max-height: 280px;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
    }

    /* Group Directory Navigation */
    .group-nav-wrap {
      padding-top: 20px;
    }

    .group-nav {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
    }

    .group-nav-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .group-nav-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .group-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: var(--radius-sm);
      background: var(--bg-canvas);
      border: 1px solid var(--border-light);
      color: var(--text-body);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      max-width: 100%;
      transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
    }

    .group-nav-link:hover {
      background: var(--bg-accent-soft);
      border-color: #BFDBFE;
      color: var(--accent);
      text-decoration: none;
    }

    .group-nav-index {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .group-nav-name {
      overflow-wrap: anywhere;
    }

    .group-nav-count {
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* Main Catalog */
    main {
      padding: 24px 0 56px;
    }

    .course-group {
      scroll-margin-top: 96px;
    }

    .course-group + .course-group {
      margin-top: 38px;
    }

    .group-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px 16px;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 2px solid var(--text-primary);
    }

    .group-heading-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .group-number {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .group-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      overflow-wrap: break-word;
    }

    .group-meta {
      font-size: 13px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .course-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Course Card */
    .course-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.03);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .course-card:hover {
      border-color: var(--border-strong);
    }

    .course-card[data-selected="true"] {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 4px 14px rgba(37, 99, 235, 0.07);
      background: #FCFDFF;
    }

    .course-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .check-hit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin: -4px 0 0 -6px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      flex-shrink: 0;
    }

    .check-hit:hover {
      background: var(--bg-accent-soft);
    }

    .course-checkbox {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      width: 19px;
      height: 19px;
      border: 1.5px solid #9CA3AF;
      border-radius: 5px;
      background: var(--bg-surface);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background-color 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .course-checkbox::after {
      content: "";
      width: 10px;
      height: 6px;
      border-left: 2px solid #FFFFFF;
      border-bottom: 2px solid #FFFFFF;
      transform: rotate(-45deg) translate(0.5px, -1px) scale(0);
      transition: transform 0.12s ease;
    }

    .course-checkbox:hover {
      border-color: var(--accent);
    }

    .course-checkbox:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .course-checkbox:checked::after {
      transform: rotate(-45deg) translate(0.5px, -1px) scale(1);
    }

    .course-checkbox:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px var(--accent-ring);
    }

    .course-main {
      flex: 1 1 auto;
      min-width: 0;
    }

    .course-heading-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px 14px;
    }

    .course-title {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
      line-height: 1.4;
      color: var(--text-primary);
      overflow-wrap: break-word;
    }

    .course-term {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.5;
      white-space: nowrap;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .course-body {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .course-summary,
    .course-materials {
      margin: 0;
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--text-body);
      overflow-wrap: break-word;
    }

    .course-materials {
      color: var(--text-secondary);
    }

    .course-links {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .course-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid #DBEAFE;
      background: var(--bg-accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      max-width: 100%;
      overflow-wrap: anywhere;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .course-link:hover {
      background: #DBEAFE;
      border-color: #93C5FD;
      color: var(--accent-hover);
      text-decoration: none;
    }

    .course-link-arrow {
      font-size: 12px;
      line-height: 1;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .empty-state {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--border-light);
      background: var(--bg-surface);
      padding: 20px 0 28px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 20px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
    }

    @media (max-width: 720px) {
      .container {
        padding-left: 16px;
        padding-right: 16px;
      }

      .masthead {
        padding: 20px 0 18px;
      }

      .toolbar {
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .toolbar-actions {
        width: 100%;
      }

      .toolbar-actions .btn-primary {
        flex: 1 1 auto;
      }

      .course-group {
        scroll-margin-top: 132px;
      }

      .group-title {
        font-size: 18px;
      }

      .course-card {
        padding: 15px 14px;
      }

      .course-top {
        gap: 10px;
      }

      .course-title {
        font-size: 16px;
      }

      .course-term {
        white-space: normal;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
    .saved-mark {font-size:.75rem;color:#155e75;background:#ecfeff;padding:2px 7px;border-radius:4px}
    .course-facts {margin:14px 0 10px;padding:10px 14px;background:#f7f8fa;border-radius:6px}
    .course-facts > div {display:grid;grid-template-columns:6em minmax(0,1fr);gap:10px;margin:4px 0;font-size:.9rem;line-height:1.65}
    .course-facts dt {color:#475569;font-weight:600}
    .course-facts dd {margin:0;overflow-wrap:anywhere}
    .course-facts dd a {margin-inline-start:.6em;color:#1e40af}
    @media(max-width:600px){.course-facts > div{grid-template-columns:1fr;gap:0;margin:8px 0}}
    .topic-overview {padding:12px 16px;margin:0 0 1rem;background:#f2f8f7;border-left:3px solid #0f766e}
    .topic-overview h3,.study-order-heading {font-size:1rem;color:#233e3a;margin:0 0 .4rem}
    .topic-overview p {margin:.45rem 0;line-height:1.65}
    .topic-overview a {color:#1e40af;text-underline-offset:3px}
    .rank-nav {display:flex;flex-wrap:wrap;gap:.45rem 1rem;margin:0 0 1rem}
    .rank-nav a {color:#1e40af;font-size:.9rem;text-underline-offset:3px}
    .rank-reason {margin:.6rem 0;padding:.55rem .75rem;border-left:3px solid #0f766e;background:#f2f8f7;line-height:1.65;color:#233e3a}
    .rank-reason strong {color:#115e59;margin-right:.65em;white-space:nowrap}
    .course-title[id] {scroll-margin-top:8rem}
  </style>
<style>
  :root {
    --bg-canvas: #F6F7F9;
    --bg-surface: #FFFFFF;
    --bg-subtle: #F9FAFB;
    --bg-accent-soft: #EFF6FF;
    --text-primary: #111827;
    --text-body: #1F2937;
    --text-secondary: #4B5563;
    --text-muted: #6B7280;
    --border-light: #E5E7EB;
    --border-strong: #D1D5DB;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-border: #BFDBFE;
    --accent-ring: rgba(37, 99, 235, 0.22);
    --teal: #0F766E;
    --teal-ink: #115E59;
    --teal-soft: #F0FDFA;
    --teal-border: #99F6E4;
    --amber-ink: #92400E;
    --amber-soft: #FFFBEB;
    --amber-border: #FDE68A;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 12px;
    --max-width: 1180px;
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif;
  }

  body {
    background-color: var(--bg-canvas);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 14.5px;
    line-height: 1.6;
  }

  /* Compact Editorial Masthead */
  .masthead {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-light);
    padding: 12px 0 11px;
  }

  .masthead-top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 16px;
  }

  .masthead-title {
    margin: 0;
    font-size: clamp(20px, 2.2vw, 24px);
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .masthead-meta {
    margin: 0;
    gap: 6px 10px;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .masthead-meta a {
    color: var(--accent);
    font-weight: 500;
  }

  .masthead-details {
    margin-top: 8px;
  }

  .masthead-details-summary {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    padding: 4px 10px;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    background: var(--bg-subtle);
    color: var(--text-secondary);
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.4;
    cursor: pointer;
    list-style: none;
    user-select: none;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .masthead-details-summary::-webkit-details-marker {
    display: none;
  }

  .masthead-details-summary:hover {
    background: var(--bg-accent-soft);
    border-color: var(--accent-border);
    color: var(--accent);
  }

  .masthead-details-summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .masthead-details-caret,
  .course-details-caret {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-right: 1.75px solid currentColor;
    border-bottom: 1.75px solid currentColor;
    transform: rotate(-45deg);
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }

  .masthead-details[open] > .masthead-details-summary .masthead-details-caret,

  .course-top {
    gap: 12px;

  .course-heading-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 7px;

  .course-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.38;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }

  .course-title[id] {
    scroll-margin-top: 84px;
  }

  .course-meta-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    min-width: 0;

  .course-term {

    border: 1px solid var(--border-light);

    font-size: 12px;
    font-weight: 500;
    line-height: 1.45;

  .saved-mark {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 5px;
    background: var(--teal-soft);
    border: 1px solid var(--teal-border);
    color: var(--teal-ink);
    font-size: 12px;
    font-weight: 600;
    line-height: 1.45;
  }

  .meta-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 5px;
    border: 1px solid var(--border-light);
    background: var(--bg-subtle);
    color: var(--text-secondary);
    font-size: 12px;
    line-height: 1.45;
    max-width: 100%;
    overflow-wrap: anywhere;
  }

  .meta-tag-k {
    color: var(--text-muted);
    font-weight: 500;
  }

  .meta-tag-v {
    font-weight: 600;
  }

  .meta-tag[data-tone="teal"] {
    background: var(--teal-soft);
    border-color: var(--teal-border);
    color: var(--teal-ink);
  }

  .meta-tag[data-tone="teal"] .meta-tag-k {
    color: var(--teal);
  }

  .meta-tag[data-tone="blue"] {
    background: var(--bg-accent-soft);
    border-color: var(--accent-border);
    color: var(--accent-hover);
  }

  .meta-tag[data-tone="blue"] .meta-tag-k {
    color: var(--accent);
  }

  .meta-tag[data-tone="amber"] {
    background: var(--amber-soft);
    border-color: var(--amber-border);
    color: var(--amber-ink);
  }

  .meta-tag[data-tone="amber"] .meta-tag-k {
    color: #B45309;
  }

  /* Study Order Rank & Rationale (Action Blue aligned with 首轮共学顺位) */
  .rank-reason {
    margin: 10px 0 0;
    padding: 8px 12px;
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-body);
    overflow-wrap: anywhere;

  .rank-reason strong {
    display: inline-block;
    padding: 1px 8px;
    margin: 0 8px 2px 0;
    border-radius: 999px;
    background: var(--bg-accent-soft);
    border: 1px solid var(--accent-border);
    color: var(--accent-hover);
    font-size: 12px;
    font-weight: 650;
    line-height: 1.45;
    white-space: nowrap;

  /* Native Card Details Drawer */

    margin-top: 10px;

    border-radius: var(--radius-md);
    background: var(--bg-subtle);

    background: var(--bg-surface);
    border-color: var(--border-strong);
  }

    flex-wrap: wrap;

  .course-details[open] > .course-details-summary {

    border-bottom-left-radius: 0;

  .course-details-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    color: var(--accent);

  .course-details-panel .course-links {

  .course-link {
    padding: 4px 9px;

  /* Responsive: Tablet & Mobile Single Column */

  <script>
    (function () {
      'use strict';

      var STORAGE_KEY = 'ai_agent_courses_selection_v1';

      var catalogRoot = document.getElementById('catalog-root');
      var catalogStats = document.getElementById('catalog-stats');
      var groupNavWrap = document.getElementById('group-nav-wrap');
      var groupNavList = document.getElementById('group-nav-list');
      var selectedCountEl = document.getElementById('selected-count');
      var selectedTotalEl = document.getElementById('selected-total');
      var copyFeedbackEl = document.getElementById('copy-feedback');
      var copyJsonBtn = document.getElementById('copy-json-btn');
      var toggleManualBtn = document.getElementById('toggle-manual-btn');
      var clearSelectionBtn = document.getElementById('clear-selection-btn');
      var manualPanel = document.getElementById('manual-copy-panel');
      var manualOutput = document.getElementById('manual-json-output');
      var fallbackHint = document.getElementById('fallback-hint');
      var selectJsonBtn = document.getElementById('select-json-btn');
      var closeManualBtn = document.getElementById('close-manual-btn');

      var feedbackTimer = null;

      function asText(value) {
        return typeof value === 'string' ? value.trim() : '';
      }

      function getSafeUrl(rawUrl) {
        var trimmed = asText(rawUrl);
        if (!trimmed || !/^https?:\/\//i.test(trimmed)) {
          return null;
        }
        try {
          var parsed = new URL(trimmed);
          if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
            return trimmed;
          }
        } catch (err) {
          return null;
        }
        return null;
      }

      function parseCourseData() {
        var dataEl = document.getElementById('course-data');
        if (!dataEl) {
          return null;
        }
        var raw = (dataEl.textContent || '').trim();
        if (!raw) {
          return null;
        }
        try {
          var parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : null;
        } catch (err) {
          return null;
        }
      }

      function loadSelection(validIds) {
        var set = new Set();
        try {
          var saved = window.localStorage.getItem(STORAGE_KEY);
          if (!saved) {
            return set;
          }
          var parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            parsed.forEach(function (id) {
              if (typeof id === 'string' && validIds.has(id)) {
                set.add(id);
              }
            });
          }
        } catch (err) {
          return set;
        }
        return set;
      }

      function saveSelection(selectedIds) {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(selectedIds)));
        } catch (err) {
          // Ignore storage quota or private-mode restrictions
        }
      }

      function setFeedback(message, tone) {
        if (feedbackTimer) {
          window.clearTimeout(feedbackTimer);
          feedbackTimer = null;
        }
        copyFeedbackEl.textContent = message || '';
        if (tone) {
          copyFeedbackEl.setAttribute('data-tone', tone);
        } else {
          copyFeedbackEl.removeAttribute('data-tone');
        }
        if (message) {
          feedbackTimer = window.setTimeout(function () {
            copyFeedbackEl.textContent = '';
            copyFeedbackEl.removeAttribute('data-tone');
          }, 5000);
        }
      }

      function renderEmpty(message) {
        catalogRoot.textContent = '';
        var box = document.createElement('div');
        box.className = 'empty-state';
        box.textContent = message;
        catalogRoot.appendChild(box);
        copyJsonBtn.disabled = true;
        toggleManualBtn.disabled = true;
        clearSelectionBtn.disabled = true;
      }

      function addFact(list, label, tag, text) {
        var row = document.createElement('div');
        var name = document.createElement('dt');
        name.textContent = label;
        var value = document.createElement('dd');
        if (tag) {
          var heading = document.createElement('strong');
          heading.textContent = tag + '　';
          value.appendChild(heading);
        }
        value.appendChild(document.createTextNode(text));
        row.append(name, value);
        list.appendChild(row);
        return value;
      }

      var rawCourses = parseCourseData();
      if (!rawCourses) {
        renderEmpty('尚未注入课程数据，请检查课程 JSON 数据源。');
        return;
      }

      var keyCounter = new Map();
      var courses = rawCourses.map(function (item, idx) {
        var title = asText(item && item.title) || ('未命名课程 ' + (idx + 1));
        var term = asText(item && item.term);
        var group = asText(item && item.group) || '未分组';
        var summary = asText(item && item.summary);
        var materials = asText(item && item.materials);
        var links = Array.isArray(item && item.links)
          ? item.links
              .filter(function (link) {
                return link && (asText(link.label) || asText(link.url));
              })
              .map(function (link) {
                var url = asText(link.url);
                var label = asText(link.label) || url;
                return { label: label, url: url };
              })
          : [];

        var baseKey = item.id;
        var seen = keyCounter.get(baseKey) || 0;
        keyCounter.set(baseKey, seen + 1);
        var id = seen === 0 ? baseKey : baseKey + '#' + seen;

        return {
          rankReason: item.rankReason,
          leadOrder: item.leadOrder,
          leadText: item.leadText,
          leadSignal: item.leadSignal,
          saved: item.saved,
          state: item.state, timing: item.timing,
          coverage: item.coverage, coverageDetail: item.coverageDetail, statusUrl: item.statusUrl,
          id: id,
          index: item.anchor,
          title: title,
          term: term,
          group: group,
          summary: summary,
          materials: materials,
          links: links
        };
      });

      if (courses.length === 0) {
        renderEmpty('当前清单暂无课程条目。');
        return;
      }

      // Preserve exact first-seen group order and original course order
      var groupsMap = new Map();
      courses.forEach(function (course) {
        if (!groupsMap.has(course.group)) {
          groupsMap.set(course.group, []);
        }
        groupsMap.get(course.group).push(course);
      });
      var groups = Array.from(groupsMap.entries()).map(function (entry, groupIdx) {
        return {
          id: 'group-' + (groupIdx + 1),
          number: String(groupIdx + 1).padStart(2, '0'),
          name: entry[0],
          items: entry[1]
        };
      });

      var validIds = new Set(courses.map(function (c) { return c.id; }));
      var selectedIds = loadSelection(validIds);
      var cardById = new Map();
      var checkboxById = new Map();

      function buildExportJson() {
        var payload = courses
          .filter(function (course) {
            return selectedIds.has(course.id);
          })
          .map(function (course) {
            return {
              title: course.title,
              term: course.term,
              group: course.group,
              links: course.links.map(function (link) {
                return {
                  label: link.label,
                  url: link.url
                };
              })
            };
          });
        return JSON.stringify(payload, null, 2);
      }

      function syncManualOutput() {
        manualOutput.value = buildExportJson();
      }

      function openManualPanel(hintText, autoSelect) {
        syncManualOutput();
        if (hintText) {
          fallbackHint.textContent = hintText;
        }
        manualPanel.hidden = false;
        toggleManualBtn.setAttribute('aria-expanded', 'true');
        if (autoSelect) {
          manualOutput.focus();
          manualOutput.select();
        }
      }

      function closeManualPanel() {
        manualPanel.hidden = true;
        toggleManualBtn.setAttribute('aria-expanded', 'false');
      }

      function updateSelectionUI() {
        var count = selectedIds.size;
        selectedCountEl.textContent = String(count);
        selectedCountEl.setAttribute('data-active', count > 0 ? 'true' : 'false');
        selectedTotalEl.textContent = '/ ' + courses.length + ' 门';
        clearSelectionBtn.disabled = count === 0;

        if (!manualPanel.hidden) {
          syncManualOutput();
        }
      }

      // Render stats
      var statTotal = document.createElement('span');
      statTotal.textContent = '共 ' + courses.length + ' 门课程';
      var statGroups = document.createElement('span');
      statGroups.textContent = groups.length + ' 个分组';
      catalogStats.appendChild(statTotal);
      catalogStats.appendChild(statGroups);

      // Render group navigation
      var navFrag = document.createDocumentFragment();
      groups.forEach(function (group) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'group-nav-link';
        a.href = '#' + group.id;

        var idxSpan = document.createElement('span');
        idxSpan.className = 'group-nav-index';
        idxSpan.textContent = group.number;

        var nameSpan = document.createElement('span');
        nameSpan.className = 'group-nav-name';
        nameSpan.textContent = group.name;

        var countSpan = document.createElement('span');
        countSpan.className = 'group-nav-count';
        countSpan.textContent = String(group.items.length);

        a.appendChild(idxSpan);
        a.appendChild(nameSpan);
        a.appendChild(countSpan);
        li.appendChild(a);
        navFrag.appendChild(li);
      });
      groupNavList.appendChild(navFrag);
      groupNavWrap.hidden = false;

      // Render course sections
      var catalogFrag = document.createDocumentFragment();
      groups.forEach(function (group) {
        var section = document.createElement('section');
        section.className = 'course-group';
        section.id = group.id;

        var headingId = group.id + '-heading';
        section.setAttribute('aria-labelledby', headingId);

        var header = document.createElement('div');
        header.className = 'group-header';

        var headingWrap = document.createElement('div');
        headingWrap.className = 'group-heading-wrap';

        var numSpan = document.createElement('span');
        numSpan.className = 'group-number';
        numSpan.setAttribute('aria-hidden', 'true');
        numSpan.textContent = group.number;

        var h2 = document.createElement('h2');
        h2.className = 'group-title';
        h2.id = headingId;
        h2.textContent = group.name;

        headingWrap.appendChild(numSpan);
        headingWrap.appendChild(h2);

        var metaSpan = document.createElement('span');
        metaSpan.className = 'group-meta';
        metaSpan.textContent = group.items.length + ' 门';

        header.appendChild(headingWrap);
        header.appendChild(metaSpan);
        section.appendChild(header);

        var overview = document.createElement('div');
        overview.className = 'topic-overview';
        var leadHeading = document.createElement('h3');
        leadHeading.textContent = group.items.length === 1 ? '课程范围' : '方向代表课';
        overview.appendChild(leadHeading);
        group.items.filter(function (course) { return course.leadOrder; })
          .sort(function (a, b) { return a.leadOrder - b.leadOrder; })
          .forEach(function (course) {
            var line = document.createElement('p');
            var link = document.createElement('a');
            link.href = '#ranked-course-' + course.index;
            link.textContent = course.title.split(' · ')[0];
            line.appendChild(link);
            line.appendChild(document.createTextNode('　' + course.leadText + (course.leadSignal ? ' ' + course.leadSignal : '')));
            overview.appendChild(line);
          });
        section.appendChild(overview);
        var orderHeading = document.createElement('h3');
        orderHeading.className = 'study-order-heading';
        orderHeading.textContent = '首轮共学顺位';
        if (group.items.length > 1) section.appendChild(orderHeading);
        var rankNav = document.createElement('nav');
        rankNav.className = 'rank-nav';
        rankNav.setAttribute('aria-label', group.name + '组内排序');
        if (group.items.length > 1) section.appendChild(rankNav);

        var list = document.createElement('ol');
        list.className = 'course-list';

        group.items.forEach(function (course, position) {
          var isSelected = selectedIds.has(course.id);

          var li = document.createElement('li');
          var article = document.createElement('article');
          article.className = 'course-card';
          article.setAttribute('data-selected', isSelected ? 'true' : 'false');

          var top = document.createElement('div');
          top.className = 'course-top';

          var checkboxId = 'course-check-' + course.index;
          var checkLabel = document.createElement('label');
          checkLabel.className = 'check-hit';
          checkLabel.setAttribute('for', checkboxId);

          var checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'course-checkbox';
          checkbox.id = checkboxId;
          checkbox.checked = isSelected;
          checkbox.setAttribute('aria-label', '选择课程：' + course.title);

          checkbox.addEventListener('change', function () {
            if (checkbox.checked) {
              selectedIds.add(course.id);
              article.setAttribute('data-selected', 'true');

    if (!titleEl || !dl || dl.querySelector('[data-learner-row]')) continue;

    const rawTitle = titleEl.textContent || '';
    const record = byTitle.get(rawTitle) || byTitle.get(rawTitle.trim());
    if (!record) continue;

    const entries = Array.isArray(record.entries) ? record.entries.filter(Boolean) : [];
    const note = trimStr(record.note);
    if (!entries.length && !note) continue;

    const row = el('div');
    row.setAttribute('data-learner-row', 'true');
    const dt = el('dt', '学习者亲历');
    const dd = el('dd');

    if (entries.length) {
      const list = el('ul');
      list.style.listStyle = 'none';
      list.style.margin = '0';
      list.style.padding = '0';
      list.style.display = 'grid';
      list.style.gap = '0.45rem';

      for (const entry of entries) {
        const exp = trimStr(entry.experience);
        const source = trimStr(entry.source);
        const term = trimStr(entry.term);
        const url = trimStr(entry.url);
        const quote = trimStr(entry.quote);
        const label = source && term ? source + ' · ' + term : (source || term || (url ? '来源' : ''));
        if (!exp && !label && !quote) continue;

        const li = el('li');
        const line = el('div');
        if (exp) line.appendChild(el('span', exp));
        if (label) {
          if (exp) line.appendChild(document.createTextNode(' '));
          if (/^https?:\/\//i.test(url)) {
            const link = el('a', label);
            link.href = url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            line.appendChild(link);
          } else {
            line.appendChild(el('span', label));
          }
        }
        if (line.childNodes.length) li.appendChild(line);

        if (quote) {
          const details = el('details');
          details.style.marginTop = '0.25rem';
          const summary = el('summary', '查看原话');
          summary.style.cursor = 'pointer';
          const blockquote = el('blockquote', quote);
          blockquote.style.margin = '0.25rem 0 0';
          blockquote.style.paddingLeft = '0.6rem';
          blockquote.style.borderLeft = '2px solid currentColor';
          blockquote.style.opacity = '0.85';
          details.appendChild(summary);
          details.appendChild(blockquote);
          li.appendChild(details);
        }

        list.appendChild(li);
      }

      if (list.childNodes.length) dd.appendChild(list);
    }

    if (note) {
      const noteEl = el('p', note);
      noteEl.style.margin = dd.childNodes.length ? '0.45rem 0 0' : '0';
      noteEl.style.opacity = '0.85';
      dd.appendChild(noteEl);
    }

    if (!dd.childNodes.length) continue;

    row.appendChild(dt);
    row.appendChild(dd);

    let beforeNode = null;
    for (const child of dl.children) {
      const childDt = child.querySelector('dt');
      if (childDt && trimStr(childDt.textContent) === 'X 讨论热度') {
        beforeNode = child;
        break;
      }
    }
    if (!beforeNode) {
      for (const child of dl.children) {
        const childDt = child.querySelector('dt');
        if (childDt && childDt.textContent && childDt.textContent.indexOf('X 讨论热度') !== -1) {
          beforeNode = child;
          break;
        }
      }
    }

    if (beforeNode) dl.insertBefore(row, beforeNode);
    else dl.appendChild(row);
  }
})();
</script>
<script>
(function () {
  "use strict";

  function normText(value) {
    return String(value || "").replace(/\s+/g, " ").trim();
  }

  function cleanLabel(value) {
    return String(value || "").replace(/[\u3000\s]+/g, " ").trim();
  }

  function parseCourseData() {
    var map = new Map();
    var scriptEl = document.getElementById("course-data");
    if (!scriptEl || !scriptEl.textContent) return map;

    var raw;
    try {
      raw = JSON.parse(scriptEl.textContent);
    } catch (e) {
      return map;
    }

    var items = [];
    function collect(node) {
      if (!node) return;
      if (Array.isArray(node)) {
        for (var i = 0; i < node.length; i++) {
          var entry = node[i];
          if (entry && typeof entry === "object") {
            if (typeof entry.title === "string") {
              items.push(entry);
            } else if (Array.isArray(entry.courses)) {
              collect(entry.courses);
            }
          }
        }
      } else if (typeof node === "object") {
        if (Array.isArray(node.courses)) collect(node.courses);
        if (Array.isArray(node.groups)) collect(node.groups);
      }
    }
    collect(raw);

    for (var j = 0; j < items.length; j++) {
      var item = items[j];
      var key = normText(item.title);
      if (key) {
        map.set(key, {
          state: cleanLabel(item.state),
          coverage: cleanLabel(item.coverage)
        });
      }
    }
    return map;
  }

  function extractFallbackFacts(factsEl) {
    var result = { state: "", coverage: "" };
    if (!factsEl) return result;
    var rows = factsEl.children;
    for (var i = 0; i < rows.length; i++) {
      var dt = rows[i].querySelector("dt");
      var dd = rows[i].querySelector("dd");
      if (!dt || !dd) continue;
      var label = normText(dt.textContent);
      var strong = dd.querySelector("strong");
      var val = strong ? cleanLabel(strong.textContent) : "";
      if (!val) continue;
      if (label === "授课进度" && !result.state) result.state = val;
      if (label === "公开材料" && !result.coverage) result.coverage = val;
    }
    return result;
  }

  function getStateTone(state) {
    if (!state) return "neutral";
    if (/在授|进行|更新|常青|连载/.test(state)) return "teal";
    if (/待开|未开|暂停|待核/.test(state)) return "amber";
    return "neutral";
  }

  function getCoverageTone(coverage) {
    if (!coverage) return "neutral";
    if (/完整|全公开|全部公开|齐全/.test(coverage)) return "teal";
    if (/部分|陆续|半公开/.test(coverage)) return "blue";
    if (/少|有限|未公开|仅大纲|受限|无录像|需/.test(coverage)) return "amber";
    return "neutral";
  }

  function createMetaTag(prefix, value, extraClass, tone) {
    var tag = document.createElement("span");
    tag.className = "meta-tag " + extraClass;
    tag.setAttribute("data-tone", tone);

    var keySpan = document.createElement("span");
    keySpan.className = "meta-tag-k";
    keySpan.textContent = prefix;

    var valSpan = document.createElement("span");
    valSpan.className = "meta-tag-v";
    valSpan.textContent = value;

    tag.appendChild(keySpan);
    tag.appendChild(valSpan);
    return tag;
  }

  function enhanceMasthead() {
    var header = document.querySelector("header.masthead");
    if (!header) return;
    var container = header.querySelector(".container");
    if (!container || container.querySelector(".masthead-details")) return;

    var title = container.querySelector(".masthead-title");
    var meta = container.querySelector(".masthead-meta");
    var stats = container.querySelector("#catalog-stats");
    var descs = Array.prototype.slice.call(container.querySelectorAll(".masthead-desc"));

    if (!title) return;

    var topRow = document.createElement("div");
    topRow.className = "masthead-top";
    topRow.appendChild(title);
    if (meta) topRow.appendChild(meta);

    var details = document.createElement("details");
    details.className = "masthead-details";

    var summary = document.createElement("summary");
    summary.className = "masthead-details-summary";

    var caret = document.createElement("span");
    caret.className = "masthead-details-caret";
    caret.setAttribute("aria-hidden", "true");

    var label = document.createElement("span");
    label.textContent = "统计与研究方法说明";

    var hint = document.createElement("span");
    hint.className = "masthead-details-hint";
    hint.textContent = "（目录导览 · 亲历检索范围 · X 核对口径）";

    summary.appendChild(caret);
    summary.appendChild(label);
    summary.appendChild(hint);
    details.appendChild(summary);

    var body = document.createElement("div");
    body.className = "masthead-details-body";
    if (stats) body.appendChild(stats);
    for (var i = 0; i < descs.length; i++) {
      body.appendChild(descs[i]);
    }
    details.appendChild(body);

    container.insertBefore(topRow, container.firstChild);
    container.insertBefore(details, topRow.nextSibling);
  }

  function enhanceLayout() {
    var navWrap = document.getElementById("group-nav-wrap");
    var mainEl = document.getElementById("main-content");
    if (!navWrap || !mainEl) return;
    if (navWrap.parentElement && navWrap.parentElement.classList.contains("catalog-shell")) return;

    var shell = document.createElement("div");
    shell.className = "catalog-shell container";
    navWrap.parentNode.insertBefore(shell, navWrap);
    shell.appendChild(navWrap);
    shell.appendChild(mainEl);

    var navItems = navWrap.querySelectorAll("#group-nav-list > li");
    if (navItems.length > 1) {
      var lastItem = navItems[navItems.length - 1];
      var lastLink = lastItem.querySelector("a");
      if (lastLink && (lastLink.getAttribute("href") === "#group-7" || /综合/.test(lastLink.textContent))) {
        lastItem.classList.add("group-nav-item--standalone");
      }
    }
  }

  function enhanceGroups() {
    var groups = document.querySelectorAll("#catalog-root .course-group");
    for (var i = 0; i < groups.length; i++) {
      var group = groups[i];
      if (group.querySelector(".group-brief")) continue;

      var overview = null;
      var orderHeading = null;
      var rankNav = null;
      var courseList = null;

      var children = group.children;
      for (var c = 0; c < children.length; c++) {
        var ch = children[c];
        if (ch.classList.contains("topic-overview")) overview = ch;
        else if (ch.classList.contains("study-order-heading")) orderHeading = ch;
        else if (ch.classList.contains("rank-nav")) rankNav = ch;
        else if (ch.classList.contains("course-list")) courseList = ch;
      }

      var hasOverview = Boolean(overview);
      var hasOrder = Boolean(orderHeading || rankNav);
      if (!hasOverview && !hasOrder) continue;

      var brief = document.createElement("div");
      brief.className = "group-brief" + (hasOverview && hasOrder ? "" : " group-brief--single");

      if (hasOverview) {
        brief.appendChild(overview);
      }

      if (hasOrder) {
        var orderPanel = document.createElement("div");
        orderPanel.className = "study-order-panel";
        if (orderHeading) orderPanel.appendChild(orderHeading);
        if (rankNav) orderPanel.appendChild(rankNav);
        brief.appendChild(orderPanel);
      }

      if (courseList) {
        group.insertBefore(brief, courseList);
      } else {
        group.appendChild(brief);
      }
    }
  }

  function countCardMeta(nodes) {
    var learnerCount = 0;
    var xCount = 0;
    var linkCount = 0;

    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      if (!node || node.nodeType !== 1) continue;

      if (node.classList.contains("course-links")) {
        linkCount += node.querySelectorAll("a.course-link").length;
      } else if (node.classList.contains("course-facts")) {
        learnerCount += node.querySelectorAll("[data-learner-row] ul > li").length;
        var rows = node.children;
        for (var r = 0; r < rows.length; r++) {
          var dt = rows[r].querySelector("dt");
          var dd = rows[r].querySelector("dd");
          if (dt && dd && /X\s*评价/.test(dt.textContent)) {
            xCount += dd.querySelectorAll("a[href]").length;
          }
        }
      }
    }

    var parts = [];
    if (learnerCount > 0) parts.push(learnerCount + " 条亲历");
    if (xCount > 0) parts.push(xCount + " 条 X 证据");
    if (linkCount > 0) parts.push(linkCount + " 个链接");
    return parts.length > 0 ? parts.join(" · ") : "展开完整说明";
  }

  function enhanceCards(courseMap) {
    var cards = document.querySelectorAll("#catalog-root .course-card");
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var main = card.querySelector(".course-main");
      if (!main || main.querySelector(".course-details")) continue;

      var headingRow = main.querySelector(".course-heading-row");
      var titleEl = headingRow ? headingRow.querySelector(".course-title") : null;
      var termEl = headingRow ? headingRow.querySelector(".course-term") : null;
      var savedEl = headingRow ? headingRow.querySelector(".saved-mark") : null;
      var rankReasonEl = null;
      var factsEl = main.querySelector(".course-facts");

      var titleKey = titleEl ? normText(titleEl.textContent) : "";
      var info = courseMap.get(titleKey);
      var fallback = extractFallbackFacts(factsEl);
      var stateText = (info && info.state) ? info.state : fallback.state;
      var coverageText = (info && info.coverage) ? info.coverage : fallback.coverage;

      if (headingRow) {
        var metaRow = document.createElement("div");
        metaRow.className = "course-meta-row";
        if (termEl) metaRow.appendChild(termEl);
        if (savedEl) metaRow.appendChild(savedEl);
        if (stateText) {
          metaRow.appendChild(createMetaTag("状态", stateText, "meta-tag--state", getStateTone(stateText)));
        }
        if (coverageText) {
          metaRow.appendChild(createMetaTag("材料", coverageText, "meta-tag--coverage", getCoverageTone(coverageText)));
        }
        if (metaRow.childNodes.length > 0) {
          headingRow.appendChild(metaRow);
        }
      }

      var detailNodes = [];
      var children = Array.prototype.slice.call(main.children);
      for (var c = 0; c < children.length; c++) {
        var child = children[c];
        if (child === headingRow) continue;
        if (child.classList.contains("rank-reason")) {
          rankReasonEl = child;
          continue;
        }
        detailNodes.push(child);
      }

      if (detailNodes.length === 0) continue;

      var details = document.createElement("details");
      details.className = "course-details";

      var summary = document.createElement("summary");
      summary.className = "course-details-summary";

      var toggle = document.createElement("span");
      toggle.className = "course-details-toggle";

      var caret = document.createElement("span");
      caret.className = "course-details-caret";
      caret.setAttribute("aria-hidden", "true");

      var label = document.createElement("span");
      label.className = "course-details-label";
      label.textContent = "课程详情与原链接";

      toggle.appendChild(caret);
      toggle.appendChild(label);

      var metaSpan = document.createElement("span");
      metaSpan.className = "course-details-meta";
      metaSpan.textContent = countCardMeta(detailNodes);

      summary.appendChild(toggle);
      summary.appendChild(metaSpan);
      details.appendChild(summary);

      var panel = document.createElement("div");
      panel.className = "course-details-panel";
      for (var d = 0; d < detailNodes.length; d++) {
        panel.appendChild(detailNodes[d]);
      }
      details.appendChild(panel);

      if (rankReasonEl && rankReasonEl.nextSibling) {
        main.insertBefore(details, rankReasonEl.nextSibling);
      } else {
        main.appendChild(details);
      }
    }
  }

  function initNavigationPolish() {
    var navLinks = Array.prototype.slice.call(document.querySelectorAll("#group-nav-list .group-nav-link"));
    var groups = Array.prototype.slice.call(document.querySelectorAll("#catalog-root .course-group[id]"));
    if (navLinks.length === 0 || groups.length === 0) return;

    var linkById = new Map();
    for (var i = 0; i < navLinks.length; i++) {
      var href = navLinks[i].getAttribute("href") || "";
      if (href.charAt(0) === "#") {
        linkById.set(href.slice(1), navLinks[i]);
      }
    }

    function setActive(groupId) {
      for (var k = 0; k < navLinks.length; k++) {
        navLinks[k].classList.remove("is-active");
        navLinks[k].removeAttribute("aria-current");
      }
      var target = linkById.get(groupId);
      if (target) {
        target.classList.add("is-active");
        target.setAttribute("aria-current", "location");
      }
    }

    setActive(groups[0].id);

    for (var j = 0; j < navLinks.length; j++) {
      navLinks[j].addEventListener("click", function () {
        var h = this.getAttribute("href") || "";
        if (h.charAt(0) === "#") setActive(h.slice(1));
      });
    }

    if ("IntersectionObserver" in window) {
      var visible = new Map();
      var observer = new IntersectionObserver(function (entries) {
        for (var e = 0; e < entries.length; e++) {
          var entry = entries[e];
          visible.set(entry.target.id, entry.isIntersecting ? entry.boundingClientRect.top : null);
        }
        var bestId = null;
        var bestTop = Infinity;
        for (var g = 0; g < groups.length; g++) {
          var topVal = visible.get(groups[g].id);
          if (typeof topVal === "number" && Math.abs(topVal - 76) < bestTop) {
            bestTop = Math.abs(topVal - 76);
            bestId = groups[g].id;
          }
        }
        if (bestId) setActive(bestId);
      }, {
        rootMargin: "-72px 0px -65% 0px",
        threshold: 0
      });

      for (var m = 0; m < groups.length; m++) {
        observer.observe(groups[m]);
      }
    }

    var highlightTimer = null;
    function flashTarget() {
      var hash = window.location.hash;
      if (!hash || hash.length < 2) return;
      var target = document.getElementById(hash.slice(1));
      if (!target) return;
      var card = target.closest(".course-card");
      if (!card) return;
      var prev = document.querySelector(".course-card.is-jump-target");
      if (prev) prev.classList.remove("is-jump-target");
      card.classList.add("is-jump-target");
      if (highlightTimer) clearTimeout(highlightTimer);
      highlightTimer = setTimeout(function () {
        card.classList.remove("is-jump-target");
      }, 1600);
    }

    window.addEventListener("hashchange", flashTarget);
    flashTarget();
  }

  function enhance() {
    if (document.documentElement.getAttribute("data-neon-enhanced") === "1") return;
    if (!document.querySelector("#catalog-root .course-card")) return;
    document.documentElement.setAttribute("data-neon-enhanced", "1");

    var courseMap = parseCourseData();
    enhanceMasthead();
    enhanceLayout();
    enhanceGroups();
    enhanceCards(courseMap);
    initNavigationPolish();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", enhance);
  } else {
    enhance();
  }
})();
</script>
</body>
</html>
